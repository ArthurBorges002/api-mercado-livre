name: Sugerir um recurso
description: Uma ideia nova ou um endpoint do Mercado Livre que a biblioteca ainda não cobre.
title: "[Recurso] "
labels: ["melhoria"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
      description: O que você precisa fazer na integração e hoje não consegue.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Como você imagina
      description: Como seria o uso na biblioteca (métodos, parâmetros, retorno).
      render: php
  - type: input
    id: documentacao
    attributes:
      label: Documentação do Mercado Livre
      description: Link da página do endpoint ou recurso na documentação oficial.
      placeholder: https://developers.mercadolivre.com.br/pt_br/...
  - type: dropdown
    id: contribuir
    attributes:
      label: Você quer implementar?
      options:
        - Sim, posso abrir o pull request
        - Talvez, com ajuda
        - Não
    validations:
      required: true
